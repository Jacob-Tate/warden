[package]
name = "warden"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Self-hosted monitoring service (CVE first) exposing a compact feed to AI agents over MCP"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
flate2 = "1.1.11"
r2d2 = "0.8.10"
r2d2_sqlite = "0.34"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "http2", "query"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
